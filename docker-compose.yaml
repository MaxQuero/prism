services:
  database:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: prism-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prism-network

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: prism-gateway
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - prism-network

  ml-engine:
    build:
      context: ./services/ml-engine
      dockerfile: Dockerfile
    container_name: prism-ml
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - RTE_CLIENT_ID=${RTE_CLIENT_ID}
      - RTE_CLIENT_SECRET=${RTE_CLIENT_SECRET}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - prism-network

networks:
  prism-network:
    driver: bridge

volumes:
  db_data:
