[project]
name = "ml-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.13.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "ruff>=0.15.7",
]

# --- Ruff Configuration (Linter & Formatter) ---
[tool.ruff]
line-length = 100
target-version = "py310" # Aligned with Dockerfile

[tool.ruff.lint]
# Activate base rules (E, F), import sorting (I), and modernizations (UP)
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

# --- Pyright Configuration (Type Checker) ---
[tool.pyright]
typeCheckingMode = "strict" # Force strict typing
useLibraryCodeForTypes = true
reportMissingImports = true